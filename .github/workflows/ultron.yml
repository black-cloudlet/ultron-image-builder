# base -> bound-images -> kiosk -> microshift -> services -> ISO. Each layer
# builds on the previous one's digest, so a change to a service image does not
# re-pull MicroShift's control plane and vice versa. The ISO is built from the
# top of the chain, which is services, not microshift.
#
# Every version is a repository variable (Settings > Secrets and variables >
# Actions > Variables), passed here as a build arg; the Containerfiles have no
# defaults. An unset one arrives empty and fails the job before it registers.
name: ultron images + installer ISO

on:
  push:
    branches: [main]
    paths:
      - base/**
      - kiosk/**
      - microshift/**
      - services/**
      - config.toml
      - .github/workflows/ultron.yml
      - .github/workflows/build-image.yml
      - .github/workflows/build-iso.yml
  workflow_dispatch:

jobs:
  # The pinned vendor image, republished. Shared by every variant.
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      name: base
      containerfile: base/Containerfile.base
      smoke-test: base/smoke-test.base.sh
      build-args: |
        BASE=${{ vars.JETPACK_IMAGE }}
        RHEL_VERSION=${{ vars.RHEL_VERSION }}
        NVCTK_VER=${{ vars.NVIDIA_CTK_VERSION }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  # The image-embedding machinery. Shared by every variant.
  # Job id with an underscore, image name with a hyphen: needs.bound-images
  # parses as a subtraction, so a dotted reference to a hyphenated id resolves
  # to nothing instead of failing.
  bound_images:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      name: bound-images
      containerfile: base/Containerfile.podman
      smoke-test: base/smoke-test.podman.sh
      build-args: |
        BASE_IMAGE=${{ needs.base.outputs.image-ref }}
        RHEL_VERSION=${{ vars.RHEL_VERSION }}
        JTOP_VER=${{ vars.JTOP_VERSION }}
        ACM_VER=${{ vars.ACM_VERSION }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  # Firefox on DisplayPort. Below the variant: nothing in it is about the
  # cluster.
  kiosk:
    needs: bound_images
    uses: ./.github/workflows/build-image.yml
    with:
      name: kiosk
      containerfile: kiosk/Containerfile
      smoke-test: kiosk/smoke-test.sh
      build-args: BASE_IMAGE=${{ needs.bound_images.outputs.image-ref }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  microshift:
    needs: kiosk
    uses: ./.github/workflows/build-image.yml
    with:
      name: microshift
      containerfile: microshift/Containerfile
      smoke-test: microshift/smoke-test.sh
      build-args: |
        BASE_IMAGE=${{ needs.kiosk.outputs.image-ref }}
        RHEL_VERSION=${{ vars.RHEL_VERSION }}
        USHIFT_VER=${{ vars.MICROSHIFT_VERSION }}
        NVIDIA_DEVICE_PLUGIN_VER=${{ vars.NVIDIA_DEVICE_PLUGIN_VERSION }}
    secrets: inherit
    permissions: { contents: read, packages: write }

  # What runs on the cluster — cert-manager, External Secrets, KServe and the
  # Triton runtime — on top of the cluster layer rather than under it, so a
  # service changing does not re-run the MicroShift install.
  services:
    needs: microshift
    uses: ./.github/workflows/build-image.yml
    with:
      name: services
      containerfile: services/Containerfile
      smoke-test: services/smoke-test.sh
      build-args: |
        BASE_IMAGE=${{ needs.microshift.outputs.image-ref }}
        CERT_MANAGER_VER=${{ vars.CERT_MANAGER_VERSION }}
        EXTERNAL_SECRETS_VER=${{ vars.EXTERNAL_SECRETS_VERSION }}
        KSERVE_VER=${{ vars.KSERVE_VERSION }}
      # The image a node actually boots and upgrades, so it is also published
      # under the project's name without a layer suffix.
      also-as: ultron-bootc
      # Only here: the split is redone from the whole tree.
      rechunk: true
    secrets: inherit
    permissions: { contents: read, packages: write }

  # The installer config is project-wide. The image installed is ultron-bootc,
  # the top of the chain under the project's name, so neither the ISO nor a
  # node's origin names a layer; by digest, the one this run built.
  iso:
    needs: services
    uses: ./.github/workflows/build-iso.yml
    with:
      image-ref: ${{ needs.services.outputs.also-image-ref }}
      config: config.toml
      tag: ${{ needs.services.outputs.tag }}
      rhel-version: ${{ vars.RHEL_VERSION }}
    secrets: inherit
    permissions: { contents: read, packages: read }
