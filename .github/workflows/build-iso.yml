# Reusable: pushed image -> unattended Anaconda installer ISO.
#
# bib runs nested in the UBI builder, so it needs the SELinux opt-out as well as
# --privileged. Entitlement is required here too: anaconda-iso depsolves
# Anaconda from RHEL repos.
name: build installer ISO

on:
  workflow_call:
    inputs:
      image-ref:
        description: image to install, pinned by digest
        type: string
        required: true
      config:
        description: path to the bootc-image-builder config.toml
        type: string
        required: true
      tag:
        type: string
        required: true
      rhel-version:
        description: the images' RHEL release (repository variable RHEL_VERSION)
        type: string
        required: true
      runs-on:
        type: string
        default: ubuntu-24.04-arm

jobs:
  iso:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: read }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
      # The runner's ephemeral disk: the embedded images plus a multi-gigabyte
      # ISO do not fit in the job container's writable layer.
      volumes:
        - /mnt:/scratch
    env:
      ISO_NAME: ultron-${{ inputs.tag }}.iso
      SMDEV_CONTAINER_OFF: 1
      RHEL_VERSION: ${{ inputs.rhel-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check RHEL version
        run: |
          case $RHEL_VERSION in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::rhel-version is '$RHEL_VERSION': set the RHEL_VERSION repository variable"; exit 1 ;;
          esac

      - name: Register with Red Hat
        env:
          RHSM_USERNAME: ${{ secrets.RHSM_USERNAME }}
          RHSM_PASSWORD: ${{ secrets.RHSM_PASSWORD }}
        run: subscription-manager register --username="$RHSM_USERNAME" --password="$RHSM_PASSWORD"

      # RHEL repos only: UBI's once shipped a podman it could not install.
      - name: Container tools
        run: |
          sed -i 's/^enabled *= *1/enabled = 0/' /etc/yum.repos.d/ubi.repo
          ! grep -q '^enabled *= *1' /etc/yum.repos.d/ubi.repo \
            || { echo "::error::UBI repos still enabled in /etc/yum.repos.d/ubi.repo"; exit 1; }
          dnf -y install podman jq

      # Same as build-image.yml; the ISO output goes there too for space.
      - name: Put container storage and ISO output on the runner's disk
        run: |
          mkdir -p /scratch/containers /scratch/tmp /scratch/output /var/lib/containers /var/tmp output
          mount --bind /scratch/containers /var/lib/containers
          mount --bind /scratch/tmp /var/tmp
          mount --bind /scratch/output output
          df -h /var/lib/containers
          # RHEL's storage.conf mounts overlay with metacopy=on, and the runner
          # kernel defaults redirect_dir on; either one makes the storage library
          # refuse the native diff. Set the options before podman first runs.
          sed -i '/^mountopt = /s/=.*/= "nodev,redirect_dir=off"/' /etc/containers/storage.conf
          grep -n '^mountopt' /etc/containers/storage.conf || true
          grep -H . /sys/module/overlay/parameters/* || true
          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphStatus}}' | tee /tmp/graph
          grep -q 'Native Overlay Diff:true' /tmp/graph \
            || { echo "::error::podman is not on native overlay; layer commits will take minutes each"; exit 1; }

      - name: Logins
        env:
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$RH_REGISTRY_PASSWORD" | podman login registry.redhat.io -u "$RH_REGISTRY_USER" --password-stdin

      # An empty or plaintext hash still renders a valid kickstart, so a bad secret
      # would surface only as a finished ISO nobody can log into. Fail here instead.
      # env: + bash substitution rather than sed: a quote, a newline or an `&` in a
      # value would break the command or silently mangle what lands in the file.
      - name: Render config.toml
        env:
          JETSON_SSH_PUBKEY: ${{ secrets.JETSON_SSH_PUBKEY }}
          JETSON_PASSWORD_HASH: ${{ secrets.JETSON_PASSWORD_HASH }}
          CONFIG: ${{ inputs.config }}
        run: |
          check() {
            [ -n "$2" ] || { echo "::error::$1 is empty or unset; add it to the repository secrets"; exit 1; }
            case $2 in *[$'\n\r']*) echo "::error::$1 contains a line break; store it as a single line"; exit 1;; esac
          }
          check JETSON_SSH_PUBKEY "$JETSON_SSH_PUBKEY"
          check JETSON_PASSWORD_HASH "$JETSON_PASSWORD_HASH"
          case $JETSON_PASSWORD_HASH in
            \$?*\$?*\$?*) ;;
            *) echo "::error::JETSON_PASSWORD_HASH is not a crypt hash (expected \$6\$salt\$hash from 'openssl passwd -6'); the kickstart says --iscrypted, so a plaintext value can never be logged in with"; exit 1;;
          esac
          case $JETSON_SSH_PUBKEY in
            ssh-*|ecdsa-*|sk-*) ;;
            *) echo "::error::JETSON_SSH_PUBKEY is not an OpenSSH public key; it must be the contents of the .pub file, not a path to it"; exit 1;;
          esac

          # bash 5.2 expands & in the replacement; 5.1 has no such shopt to unset.
          shopt -u patsub_replacement 2>/dev/null || true
          config=$(cat "$CONFIG")
          config=${config//@JETSON_SSH_PUBKEY@/$JETSON_SSH_PUBKEY}
          config=${config//@JETSON_PASSWORD_HASH@/$JETSON_PASSWORD_HASH}
          install -m 600 /dev/null /tmp/config.toml
          printf '%s\n' "$config" > /tmp/config.toml
          if grep -q '@JETSON_' /tmp/config.toml; then
            echo "::error::unsubstituted @JETSON_ placeholder left in $CONFIG"
            exit 1
          fi

      # A kickstart that fails to parse is not caught by bib: the ISO builds, and
      # anaconda stops at the end of the systemd boot log with no visible error.
      # RHEL's pykickstart is from the same repos bib depsolves Anaconda from, so it
      # knows the options the installer will. python3.12 only for tomllib, which
      # applies TOML's string rules to `contents` exactly as bib does.
      - name: Validate the kickstart
        run: |
          dnf -y install pykickstart python3.12
          install -m 600 /dev/null /tmp/ks.cfg
          python3.12 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["customizations"]["installer"]["kickstart"]["contents"])' \
            /tmp/config.toml > /tmp/ks.cfg
          ksvalidator -v "RHEL${RHEL_VERSION%%.*}" /tmp/ks.cfg \
            || { echo "::error::the kickstart in ${{ inputs.config }} does not parse; anaconda would stop before its UI"; exit 1; }

      - name: Build ISO
        run: |
          mkdir -p output
          podman pull "${{ inputs.image-ref }}"
          podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /tmp/config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "registry.redhat.io/rhel${RHEL_VERSION%%.*}/bootc-image-builder:latest" \
            --type anaconda-iso --config /config.toml "${{ inputs.image-ref }}"

      # bib ignores menu-timeout for anaconda-iso (osbuild/images honours it for
      # bootc ISOs only from v80; bib vendors v0.251), so osbuild's 60 s stays.
      # Patch both grub.cfg copies: on the ISO, and inside images/efiboot.img,
      # the El Torito image UEFI boots, whose copy is the one GRUB reads.
      - name: Set the GRUB menu timeout to 5 s
        run: |
          dnf -y install xorriso mtools
          cd output
          xorriso -osirrox on -indev bootiso/install.iso \
            -extract /EFI/BOOT/grub.cfg grub.cfg -extract /images/efiboot.img efiboot.img
          chmod u+w grub.cfg efiboot.img
          grep -q '^set timeout=60$' grub.cfg \
            || { echo "::error::no 'set timeout=60' in the ISO's grub.cfg"; cat grub.cfg; exit 1; }
          sed -i 's/^set timeout=60$/set timeout=5/' grub.cfg
          mcopy -o -i efiboot.img grub.cfg ::/EFI/BOOT/grub.cfg
          xorriso -indev bootiso/install.iso -outdev "$ISO_NAME" -boot_image any replay \
            -map grub.cfg /EFI/BOOT/grub.cfg -map efiboot.img /images/efiboot.img
          rm -r grub.cfg efiboot.img bootiso

      # Maximum zip compression. The ISO is mostly gzip'd layers and squashfs, so
      # expect a small saving for several extra minutes of upload time.
      - uses: actions/upload-artifact@v4
        with:
          name: ultron-iso-${{ inputs.tag }}
          path: output/*.iso
          retention-days: 7
          compression-level: 9

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
