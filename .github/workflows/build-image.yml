# Reusable: build one layer and push it to GHCR. Context is the repository root
# so any layer can COPY shared tooling.
#
# Ubuntu runner for native aarch64, all work inside a UBI container so
# podman comes from RHEL and subscription-manager can supply entitlement.
# GitHub offers no RHEL-hosted runner.
name: build bootc image

on:
  workflow_call:
    inputs:
      name:
        description: image suffix; publishes ghcr.io/<owner>/ultron-bootc-<name>
        type: string
        required: true
      containerfile:
        type: string
        required: true
      smoke-test:
        description: script run inside the built image, on stdin, before pushing
        type: string
        required: true
      build-args:
        description: newline-separated KEY=VALUE pairs
        type: string
        default: ""
      also-as:
        description: |
          a second image name, ghcr.io/<owner>/<also-as>, pushed with the same
          tags as the first. Empty: none.
        type: string
        default: ""
      rechunk:
        description: split the image into reproducible per-RPM layers; top layer only
        type: boolean
        default: false
      runs-on:
        description: runner label; must be native aarch64
        type: string
        default: ubuntu-24.04-arm
    outputs:
      image-ref:
        description: pushed image pinned by digest
        value: ${{ jobs.build.outputs.image-ref }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: write }
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
      # The runner's ephemeral disk: ~10 GB of embedded images does not fit in
      # the job container's writable layer.
      volumes:
        - /mnt:/scratch
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ultron-bootc-${{ inputs.name }}
      # Use this container's registration, not the (unsubscribed) host's.
      SMDEV_CONTAINER_OFF: 1
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Container tools
        run: dnf -y install podman jq

      # UBI's default policy demands signatures for registry.redhat.io content.
      - name: Relax image signature policy in the builder
        run: |
          jq 'del(.transports)' /etc/containers/policy.json > /tmp/policy.json
          mv /tmp/policy.json /etc/containers/policy.json

      # Every job registers, including the layers that install no RPMs: the
      # variant layers need the RHEL and rhocp repos, and one code path for all
      # of them beats a per-layer flag.
      - name: Register with Red Hat
        env:
          RHSM_USERNAME: ${{ secrets.RHSM_USERNAME }}
          RHSM_PASSWORD: ${{ secrets.RHSM_PASSWORD }}
        run: subscription-manager register --username="$RHSM_USERNAME" --password="$RHSM_PASSWORD"

      # podman must end up on native overlay with the native diff, or every
      # layer commit walks the whole rootfs (~2 min each). The job container's
      # / is overlayfs, unusable as an upperdir, hence the bind onto /scratch,
      # the runner's ext4 disk.
      - name: Put container storage on the runner's disk
        run: |
          mkdir -p /scratch/containers /scratch/tmp /var/lib/containers /var/tmp
          mount --bind /scratch/containers /var/lib/containers
          mount --bind /scratch/tmp /var/tmp
          df -h /var/lib/containers
          # RHEL's storage.conf mounts overlay with metacopy=on, and the runner
          # kernel defaults redirect_dir on; either one makes the storage library
          # refuse the native diff. Set the options before podman first runs.
          sed -i '/^mountopt = /s/=.*/= "nodev,redirect_dir=off"/' /etc/containers/storage.conf
          grep -n '^mountopt' /etc/containers/storage.conf || true
          grep -H . /sys/module/overlay/parameters/* || true
          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphStatus}}' | tee /tmp/graph
          grep -q 'Native Overlay Diff:true' /tmp/graph \
            || { echo "::error::podman is not on native overlay; layer commits will take minutes each"; exit 1; }

      # One immutable tag on every build: what a node is rolled back to and what
      # the mirror keeps. latest and stable, what something upgrading follows,
      # move only on main, so a branch dispatched to test it cannot move them.
      - name: Compute tags
        id: meta
        env:
          ALSO_AS: ${{ inputs.also-as }}
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          tags="$tag"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tag latest stable"
          else
            echo "::notice::$GITHUB_REF is not main: pushing $tag only, not latest or stable"
          fi
          # Before the build rather than after it: a name podman rejects should
          # not cost twenty minutes first.
          case $ALSO_AS in
            '') ;;
            [a-z0-9]*[!a-z0-9._-]*|[!a-z0-9]*) echo "::error::not a usable image name: ${ALSO_AS}"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "building $IMAGE with tags: $tags"

      # registry.redhat.io for the base layer's FROM (the vendor image); every
      # layer logs in anyway, one code path.
      - name: Logins
        env:
          RH_REGISTRY_USER: ${{ secrets.RH_REGISTRY_USER }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$RH_REGISTRY_PASSWORD" | podman login registry.redhat.io -u "$RH_REGISTRY_USER" --password-stdin

      # Build-time only; never written into the OS image.
      - name: Write pull secret
        env:
          PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
        run: |
          install -m 600 /dev/null /tmp/pull-secret.json
          printf '%s' "$PULL_SECRET" > /tmp/pull-secret.json
          jq -e '.auths | length > 0' /tmp/pull-secret.json > /dev/null \
            || { echo "::error::OPENSHIFT_PULL_SECRET is not a pull secret with an .auths object"; exit 1; }

      # Unlike the pull secret, this one goes into the image; only kiosk/ mounts it.
      - name: Write kiosk password hash
        env:
          KIOSK_PASSWORD_HASH: ${{ secrets.JETSON_KIOSK_PASSWORD_HASH }}
        run: |
          install -m 600 /dev/null /tmp/kiosk-password-hash
          printf '%s' "$KIOSK_PASSWORD_HASH" > /tmp/kiosk-password-hash

      - name: Build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          for t in $TAGS; do
            args+=(-t "$IMAGE:$t")
          done
          podman build "${args[@]}" \
            --secret id=pullsecret,src=/tmp/pull-secret.json \
            --secret id=kiosk_password_hash,src=/tmp/kiosk-password-hash \
            -f "${{ inputs.containerfile }}" .

      # Per-RPM layers with mtimes zeroed, so an unchanged package keeps its digest.
      # Runs inside the image, where the tool is, on the builder's store and
      # storage.conf. Before the size and smoke test, so both see what is pushed.
      - name: Rechunk
        if: inputs.rechunk
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v /etc/containers/storage.conf:/etc/containers/storage.conf:ro \
            "$IMAGE:$TAG" \
            /usr/libexec/bootc-base-imagectl rechunk "$IMAGE:$TAG" "localhost/rechunked:$TAG"
          for t in $TAGS; do
            podman tag "localhost/rechunked:$TAG" "$IMAGE:$t"
          done
          # With no name given, untag strips every tag.
          podman untag "$IMAGE:$TAG" "localhost/rechunked:$TAG"
          podman run --rm "$IMAGE:$TAG" bootc container lint
          layers=$(podman image inspect --format '{{len .RootFS.Layers}}' "$IMAGE:$TAG")
          echo "::notice title=${{ inputs.name }} rechunked::$layers layers"
          podman history --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE:$TAG" | cut -c1-160
          df -h /var/lib/containers

      # Roughly what the deployment occupies on the node — the number the root LV
      # is sized against. Per layer, so the differences say where the bytes went.
      - name: Image size
        run: |
          bytes=$(podman image inspect --format '{{.Size}}' "$IMAGE:${{ steps.meta.outputs.tag }}")
          echo "::notice title=${{ inputs.name }} image size::$((bytes / 1048576)) MiB ($bytes bytes)"

      - name: Smoke test
        run: podman run --rm -i "$IMAGE:${{ steps.meta.outputs.tag }}" bash -s < "${{ inputs.smoke-test }}"

      # Downstream layers consume the digest, not the tag. Every tag names the
      # same manifest, so the digest is taken from the first push and the rest
      # only move a name onto it. The second name gets the same layers, already
      # compressed, so its manifest should be byte-identical; a different digest
      # is reported, not fatal, since nothing downstream builds on that name.
      - name: Push
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ALSO_AS: ${{ inputs.also-as }}
        run: |
          podman push --digestfile=/tmp/digest "$IMAGE:$TAG"
          for t in $TAGS; do
            [ "$t" = "$TAG" ] && continue
            podman push "$IMAGE:$t"
          done
          echo "image-ref=${IMAGE}@$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          if [ -n "$ALSO_AS" ]; then
            also="${IMAGE%/*}/$ALSO_AS"
            for t in $TAGS; do
              podman push --digestfile=/tmp/also-digest "$IMAGE:$t" "docker://$also:$t"
            done
            [ "$(cat /tmp/also-digest)" = "$(cat /tmp/digest)" ] \
              || echo "::warning::$also has digest $(cat /tmp/also-digest), $IMAGE has $(cat /tmp/digest)"
            echo "::notice title=also published as::$also@$(cat /tmp/also-digest)"
          fi

      - name: Unregister
        if: always()
        run: subscription-manager unregister || true
