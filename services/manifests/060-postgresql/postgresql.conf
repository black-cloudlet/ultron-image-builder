# The whole configuration: the postgresql.conf initdb wrote into the data
# directory is never read (the container's config_file points here), and ALTER
# SYSTEM is off, so nothing on the node can drift from git. The data directory
# is PGDATA in postgresql.yaml, which the init container and preStop read too.
hba_file = '/etc/postgresql/pg_hba.conf'
allow_alter_system = off

# Reachable only through the Services: the node firewall opens 22, 443 and
# 6443 publicly, so nothing outside the pod network sees 5432.
listen_addresses = '*'
port = 5432
max_connections = 50
# The probes and the tls-reload container come in here, on an emptyDir only
# this pod mounts.
unix_socket_directories = '/var/run/postgresql'

# TLS for every network connection (pg_hba.conf takes hostssl only). The
# certificate is from the node's device CA (certificate.yaml); clients verify
# it with the device-ca-bundle ConfigMap in their own namespace. Passwords
# authenticate clients, so no client certificates and no ssl_ca_file.
# PostgreSQL never rereads these by itself: tls-reload.sh reloads hourly.
ssl = on
ssl_cert_file = '/etc/postgresql-tls/tls.crt'
ssl_key_file = '/etc/postgresql-tls/tls.key'
password_encryption = scram-sha-256

# Against the container's 1Gi limit: shared buffers, plus work_mem per sort or
# hash per connection, plus each backend's own few MB.
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
# The CPU limit is one core, which parallel workers would only split, and they
# need dynamic shared memory in /dev/shm, which CRI-O caps at 64 MB.
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# The eMMC has poor write endurance: compress full-page images in the WAL and
# checkpoint less often. fsync and synchronous_commit stay on: a data store.
wal_compression = lz4
checkpoint_timeout = 15min
max_wal_size = 512MB

# To stderr, which is the container log.
log_timezone = 'UTC'
timezone = 'UTC'
log_checkpoints = on
