# MongoDB's passwords, generated on the node at first boot: never in git, the
# image or a registry, and different on every node. CreatedOnce: written once and
# kept, though MicroShift re-applies this root on every start. Orphan: the
# Secrets carry no owner, so renaming or dropping an ExternalSecret in a later
# image cannot cascade-delete a password and have a new one generated.
# mongod reads them only when it creates the users, on an empty /data/db, so a
# new Secret alone changes nothing: rotating one is changeUserPassword with the
# new value, then the clients' copies (CLAUDE.md has the commands).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mongodb-password
spec:
  length: 64
  # No symbols: the password goes into connection URIs and shell commands
  # unquoted and unescaped.
  symbols: 0
  # 64 characters ask for 16 digits; without repeats there are only 10.
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-app-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mongodb-app-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mongodb-password
---
# Never leaves this namespace: read it with oc get secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-root-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mongodb-root-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mongodb-password
