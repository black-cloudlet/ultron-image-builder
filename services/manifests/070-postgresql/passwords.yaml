# PostgreSQL's passwords, generated on the node at first boot: never in git, the
# image or a registry, and different on every node. CreatedOnce: written once and
# kept, though MicroShift re-applies this root on every start. Orphan: the
# Secrets carry no owner, so renaming or dropping an ExternalSecret in a later
# image cannot cascade-delete a password and have a new one generated.
# init-db.sh sets every role's password from these at each pod start, so a
# rotation is: delete the Secret, force-sync its ExternalSecret, wait for the
# new Secret, force-sync every ultron-postgresql-credentials, restart
# postgresql-0 (CLAUDE.md has the commands).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgresql-password
spec:
  length: 64
  # No symbols: the password goes into the URI clients get, and into shells,
  # unquoted. init-db.sh refuses anything but letters and digits.
  symbols: 0
  # 64 characters ask for 16 digits; without repeats there are only 10.
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-app-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: postgresql-app-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgresql-password
---
# The superuser's. Never leaves this namespace: read it with oc get secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-postgres-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: postgresql-postgres-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgresql-password
