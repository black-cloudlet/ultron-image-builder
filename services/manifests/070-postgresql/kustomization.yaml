# Sorts after everything it needs: 010 and 015 for its Certificate (cert-manager's
# CRDs, the device-ca ClusterIssuer) and 020 for its passwords (ESO's CRDs and
# controller). The pod waits for the certificate's and the passwords' Secrets.
# Who may connect, from where, is pg_hba.conf: see the smoke test's postgresql
# section.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgresql

resources:
  - namespace.yaml
  - certificate.yaml
  - passwords.yaml
  - distribute.yaml
  - postgresql.yaml

# The suffix rolls the pod when any of these change. Holds no secret: the
# passwords are their own Secrets, read by init-db.sh at pod start.
configMapGenerator:
  - name: postgresql-config
    files:
      - postgresql.conf
      - pg_hba.conf
      - init-db.sh
      - tls-reload.sh
