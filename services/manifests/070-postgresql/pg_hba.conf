# First match wins; a connection no line matches is refused. Only local and
# hostssl lines, scram-sha-256 or reject: no plaintext TCP, no trust. Checked
# line by line in the smoke test.
# TYPE  DATABASE  USER      ADDRESS       METHOD

# The pod's own socket (probes, tls-reload, oc exec), on an emptyDir no other
# pod mounts.
local   all       all                     scram-sha-256

# The superuser from inside the pod only: oc exec, or oc port-forward, which
# arrives on loopback. Its password never leaves this namespace either.
hostssl all       postgres  127.0.0.1/32  scram-sha-256
hostssl all       postgres  ::1/128       scram-sha-256
hostssl all       postgres  all           reject

# Every other role reaches its own database only (init-db.sh names each one
# after its role).
hostssl sameuser  all       all           scram-sha-256
