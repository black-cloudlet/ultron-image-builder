# Reachable only through the Services: the node firewall opens 22, 443 and
# 6443 publicly, so nothing outside the pod network sees 6379.
bind 0.0.0.0 -::*

# TLS only: port 0 closes the plaintext listener. The certificate is from the
# node's device CA (certificate.yaml); clients verify it with the ca-bundle
# ConfigMap in their own namespace. Passwords authenticate clients, so no
# client certificates. Valkey needs a CA file even so.
port 0
tls-port 6379
tls-cert-file /etc/valkey-tls/tls.crt
tls-key-file /etc/valkey-tls/tls.key
tls-ca-cert-file /etc/valkey-tls/ca.crt
tls-auth-clients no
# cert-manager renews the leaf in place, 30 days before it expires; Valkey 9.1
# rereads changed files at this interval, so no restart is needed.
tls-auto-reload-interval 3600

# Users come from a mounted Secret (users.acl): the default user is off, so
# every client must AUTH with a username and password. protected-mode stays at
# its default (on) as a second net: should the default user ever end up open,
# it still refuses non-loopback clients.
aclfile /etc/valkey-acl/users.acl

dir /data

# Half of the container's 512Mi limit: a snapshot forks, and copy-on-write can
# touch every page while the parent keeps writing. At the limit the pod is
# OOM-killed.
maxmemory 256mb
# Data store: refuse writes when full rather than silently dropping keys.
# For a pure cache use allkeys-lru instead.
maxmemory-policy noeviction

# RDB snapshots only, rarely: the eMMC has poor endurance, and AOF would write
# continuously. SIGTERM also saves before exit when a save point is set; the
# default 30 s grace period covers 256 MB on the eMMC.
save 3600 1 300 100
appendonly no
