# Valkey's passwords, generated on the node at first boot: never in git, the
# image or a registry, and different on every node. CreatedOnce: written once and
# kept, though MicroShift re-applies this root on every start. Orphan: the
# Secrets carry no owner, so renaming or dropping an ExternalSecret in a later
# image cannot cascade-delete a password and have a new one generated.
# Rotating one, in this order so clients are out of step for seconds, not the
# hour of the distribution's refresh (CLAUDE.md has the commands): delete its
# Secret, force-sync its ExternalSecret here, wait for the new Secret,
# force-sync every ultron-valkey-credentials ExternalSecret, restart valkey-0.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valkey-password
spec:
  length: 64
  # No symbols: the password goes into URLs and shell commands unquoted.
  symbols: 0
  # 64 characters ask for 16 digits; without repeats there are only 10.
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-app-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: valkey-app-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valkey-password
---
# Never leaves this namespace: read it with oc get secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-root-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: valkey-root-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valkey-password
