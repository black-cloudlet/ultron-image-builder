# Valkey's passwords, generated on the node at first boot: never in git, the
# image or a registry, and different on every node. CreatedOnce: written once and
# kept, though MicroShift re-applies this root on every start. To rotate one,
# delete its Secret, let ESO write a new one, then restart valkey-0.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valkey-password
spec:
  length: 64
  # No symbols: the password goes into URLs and shell commands unquoted.
  symbols: 0
  # 64 characters ask for 16 digits; without repeats there are only 10.
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-app-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: valkey-app-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valkey-password
---
# Never leaves this namespace: read it with oc get secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-root-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: valkey-root-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valkey-password
