apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
# The StatefulSet's governing Service: headless, so the pod gets its own name,
# valkey-0.valkey-headless.valkey.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  labels:
    app.kubernetes.io/name: valkey
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # users.acl with the generated passwords' hashes, into memory: the
      # template is in the ConfigMap, the passwords in their own Secrets, and
      # only this container reads them.
      initContainers:
        - name: acl
          image: docker.io/valkey/valkey:9.1.1-alpine3.24
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /etc/valkey/render-acl.sh
            - /etc/valkey/users.acl
            - /run/valkey-passwords
            - /etc/valkey-acl/users.acl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 16Mi
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: passwords
              mountPath: /run/valkey-passwords
              readOnly: true
            - name: acl
              mountPath: /etc/valkey-acl
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.1-alpine3.24
          imagePullPolicy: IfNotPresent
          # Explicit command: skips the image entrypoint, which only exists to
          # drop root, and restricted-v2 never runs us as root.
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 400m
              memory: 512Mi
          # The default user is off, so a bare PING would be refused. The probe
          # user (users.acl) can run PING and nothing else; the grep matters
          # because a server still loading its snapshot answers PING with an
          # error, and that must not count as ready. --insecure: the probe asks
          # whether the server answers, over 127.0.0.1, which no certificate
          # names; clients verify.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --tls --insecure --user probe --pass probe --no-auth-warning ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --tls --insecure --user probe --pass probe --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: acl
              mountPath: /etc/valkey-acl
              readOnly: true
            - name: tls
              mountPath: /etc/valkey-tls
              readOnly: true
      # 0444: the container's UID is assigned by the SCC, and it reads these
      # without counting on an fsGroup. They are visible only inside this pod.
      volumes:
        - name: config
          configMap:
            name: valkey-config
        - name: passwords
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: valkey-root-password
                  items:
                    - key: password
                      path: root
              - secret:
                  name: valkey-app-password
                  items:
                    - key: password
                      path: app
        # Memory, not disk: the hashes never touch the eMMC.
        - name: acl
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tls
          secret:
            secretName: valkey-tls
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
