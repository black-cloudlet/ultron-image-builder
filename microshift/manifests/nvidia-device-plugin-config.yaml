# The device plugin's config file.
# replicas: one iGPU, so without slicing one pod holds nvidia.com/gpu. No memory
# isolation between replicas, so the count is a claim about the SOM's RAM; 1
# disables sharing. renameByDefault stays off: the resource is nvidia.com/gpu.
# deviceIDStrategy: on Tegra the default (uuid) hands the runtime "tegra", which
# its csv mode refuses ("unsupported device id: tegra"); index hands it "0".
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      plugin:
        deviceIDStrategy: index
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 4
